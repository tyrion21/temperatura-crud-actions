version: '3.8'

services:
  temperatura-backend:
    image: ${DOCKER_BACKEND_IMAGE:-jasonhermida/temperatura-backend:latest}
    container_name: temperatura-backend-${COMPOSE_PROJECT_NAME:-test}
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://localhost:1433;databaseName=temperatura_test_db;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=j1s0n2108*
      - JAVA_OPTS=-Xmx512m -Xms256m
    network_mode: "host"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  temperatura-frontend:
    image: ${DOCKER_FRONTEND_IMAGE:-jasonhermida/temperatura-frontend:latest}
    container_name: temperatura-frontend-${COMPOSE_PROJECT_NAME:-test}
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    network_mode: "host"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - temperatura-backend
